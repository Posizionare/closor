services:
  postgres:
    image: postgres:16-alpine
    container_name: growthcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: growthcrm
    ports:
      - "5432:5432"
    volumes:
      - growthcrm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d growthcrm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  growthcrm-pgdata:
